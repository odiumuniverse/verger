<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3E6E5C"/></marker></defs><text x="30" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#3E6E5C">How verger delivers a package</text><text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6E7781">One spec, real files on every agent, a receipt that makes the next run a no-op.</text><rect x="30" y="80" width="250" height="120" rx="8" fill="#F4F7F5" stroke="#3E6E5C" stroke-width="1.5"/><text x="46" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3E6E5C">verger.toml</text><text x="46" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">[[source]] in priority order</text><text x="46" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">[[package]] id, channel, version</text><text x="46" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">disabled, except, env</text><text x="46" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">the desired state, by hand</text><rect x="355" y="80" width="250" height="120" rx="8" fill="#F4F7F5" stroke="#3E6E5C" stroke-width="1.5"/><text x="371" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3E6E5C">fetch</text><text x="371" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">from git, npm, an archive, a folder</text><text x="371" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">stable, beta, or a named version</text><text x="371" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">verger.lock pins the result</text><text x="371" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">unknown channel: exit 2, with a list</text><rect x="680" y="80" width="250" height="120" rx="8" fill="#F4F7F5" stroke="#3E6E5C" stroke-width="1.5"/><text x="696" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3E6E5C">write</text><text x="696" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">the agent's own installer, if it has one;</text><text x="696" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">otherwise a rendered folder, otherwise</text><text x="696" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">its own files, otherwise nothing at all</text><text x="696" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">and a reason why</text><path d="M 280 140 L 350 140" stroke="#3E6E5C" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M 605 140 L 675 140" stroke="#3E6E5C" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="250" width="430" height="140" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="46" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6E7781">your edits are yours</text><text x="46" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">A delivered file you changed is never overwritten:</text><text x="46" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">verger refuses and exits 3.</text><text x="46" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">--force proceeds, and copies your version to</text><text x="46" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">state/backups/&lt;timestamp&gt;/ first.</text><rect x="500" y="250" width="430" height="140" rx="8" fill="#FFFFFF" stroke="#6E7781" stroke-width="1.5" stroke-dasharray="5 4"/><text x="516" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6E7781">the receipt makes the next run free</text><text x="516" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">Every delivery is recorded: what was written,</text><text x="516" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">where, and at which version.</text><text x="516" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">The next run compares receipt against disk, so an</text><text x="516" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6E7781">unchanged package is a no-op.</text><path d="M 805 200 L 805 240" stroke="#6E7781" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M 155 200 L 155 240" stroke="#6E7781" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="30" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6E7781">Written to: claude, codex, gemini, agy, cursor, opencode, kilo, pi, dsh, omp. One watcher at a time — a second one says who holds it and exits 3.</text></svg>
