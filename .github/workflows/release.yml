name: release

on:
  push:
    tags: ["v*"]
  # A full dry run of the release pipeline before the first tag exists: build
  # and the three smoke runs happen exactly as they would for a tag, but
  # nothing is published and the tap is not bumped. The version comes from the
  # input, so a release candidate can be exercised under the name it will
  # actually be published under.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.1-rc)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Every artifact is built once, on the mac runner, and shipped to the smoke
  # matrix as a workflow artifact. The release is created only after all three
  # have run on their own OS/arch, so a broken linux-arm64 binary can never be
  # published: the smoke job failing fails the publish job.
  build:
    runs-on: macos-latest
    steps:
      # One definition of the version for the whole file, so a dispatch run and
      # a tag run cannot disagree about what they are building. On a tag it is
      # the tag; on a dispatch it is the input. A dispatch on a branch has
      # GITHUB_REF_NAME set to the BRANCH name, which is why reading it blindly
      # would name the artifacts after a branch.
      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "::error::no version: push a v* tag, or pass one to workflow_dispatch" >&2
            exit 1
          fi
          echo "building version ${version} (${EVENT})"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # One-time setup: base64 of the self-signed .p12 in MACOS_SIGN_P12, its password
      # in MACOS_SIGN_P12_PASSWORD, any throwaway keychain password in
      # MACOS_SIGN_KEYCHAIN_PASSWORD. Until then releases are ad-hoc signed.
      - name: Import the signing identity
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGN_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            echo "::warning::MACOS_SIGN_P12 is not set; releases fall back to ad-hoc signing"
            exit 0
          fi
          {
            echo "$SIGN_P12" | base64 --decode > signing.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security set-keychain-settings -lut 3600 signing.keychain
            security import signing.p12 -k signing.keychain -P "$SIGN_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" signing.keychain >/dev/null
            security list-keychains -d user -s signing.keychain $(security list-keychains -d user | tr -d '"')
            rm -f signing.p12
          } || echo "::warning::could not import the signing identity; releases fall back to ad-hoc signing"

      # The man pages come from the same cobra tree the binary is built from,
      # so a flag cannot exist in one and not the other. Generated here rather
      # than committed, because a checked-in page rots the moment a flag moves.
      - name: Generate the man pages
        run: |
          version="$VERSION"
          mkdir -p dist/man
          go run -mod=vendor ./cmd/gendocs -out dist/man -version "${version}" -date "$(date -u '+%b %Y')"
          ls -l dist/man | head

      # mandoc, not `man -l` and not groff: the macOS runner ships BSD man,
      # whose -l flag does not exist, and it ships no groff at all. mandoc is
      # in /usr/bin on every macOS runner and renders roff natively.
      #
      # Warning level, not error level, and not `man -l`/groff: the macOS
      # runner ships BSD man, whose -l flag does not exist, and it ships no
      # groff at all. mandoc is in /usr/bin on every macOS runner and renders
      # roff natively. Every page is linted, not just verger.1, because a
      # subcommand page is what a user hits when they run `verger secret set
      # --help`; a clean root page says nothing about the other forty.
      - name: Smoke the man pages
        run: |
          mandoc -T lint -W warning dist/man/*.1
          mandoc -T ascii dist/man/verger.1 > /dev/null
          echo "mandoc: $(find dist/man -name '*.1' | wc -l | tr -d ' ') pages lint clean and verger.1 renders"

      # Each tarball carries a bare `verger` at its root, because the formula
      # does `bin.install "verger"`, and a `man/` directory beside it, because
      # the formula does `man1.install Dir["man/*.1"]`. The man pages have to
      # be inside the per-platform tarball, not only in the separate
      # verger-man archive: brew installs from the platform tarball, so a page
      # that lives only in the other archive is a page no brew user gets.
      # The linux binaries cross-compile from the mac runner: CGO_ENABLED=0
      # means no cgo, so no cross toolchain is needed and the result is static.
      # They are NOT signed — a codesign signature is meaningless off darwin
      # and codesign would reject it.

      - name: Build every artifact
        run: |
          version="$VERSION"
          mkdir -p build/darwin-arm64 build/darwin-amd64 dist
          # A platform tarball without a page is a packaging bug, not a
          # downstream problem, so it fails here rather than in a user's brew.
          test -f dist/man/verger.1 || { echo "::error::dist/man/verger.1 is missing; every platform tarball carries it"; exit 1; }
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags "-X main.version=${version}" -o build/darwin-arm64/verger ./cmd/verger
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags "-X main.version=${version}" -o build/darwin-amd64/verger ./cmd/verger
          lipo -create -output dist/verger build/darwin-arm64/verger build/darwin-amd64/verger
          # Sign after lipo: merging architectures invalidates an earlier signature, and
          # the identifier must be set because codesign would default a Go binary to a.out.
          if codesign --force --sign "odiumuniverse code signing" --timestamp=none --identifier com.odiumuniverse.verger dist/verger 2>/dev/null; then
            codesign --verify --strict dist/verger
            echo "signed dist/verger"
          else
            echo "::warning::no signing identity; dist/verger stays ad-hoc signed"
          fi
          tar -czf "dist/verger-${version}-darwin-universal.tar.gz" -C dist verger man
          rm -f dist/verger

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags "-X main.version=${version}" -o dist/verger ./cmd/verger
          tar -czf "dist/verger-${version}-linux-amd64.tar.gz" -C dist verger man
          rm -f dist/verger

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=vendor -ldflags "-X main.version=${version}" -o dist/verger ./cmd/verger
          tar -czf "dist/verger-${version}-linux-arm64.tar.gz" -C dist verger man
          rm -f dist/verger

          ls -l dist


      - name: Pack the man pages
        run: |
          version="$VERSION"
          tar -czf "dist/verger-man-${version}.tar.gz" -C dist/man .

      # sha256 of every published artifact, so a user can verify a download
      # without trusting the release page.
      - name: Checksum the artifacts
        run: |
          cd dist
          shasum -a 256 ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload the darwin artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-universal
          path: dist/verger-*-darwin-universal.tar.gz
          if-no-files-found: error

      - name: Upload the linux-amd64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/verger-*-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Upload the linux-arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/verger-*-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload the checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums.txt
          if-no-files-found: error

  # Each tarball is unpacked and RUN on a runner of its own OS and arch — not
  # merely built for it. A cross-compiled binary that cannot execute is the
  # failure this catches, and `fail-fast: false` keeps the other two results so
  # one run reports all three.
  smoke:
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: darwin-universal
          - runner: ubuntu-latest
            asset: linux-amd64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # The smoke job names the same tarballs the build job produced, so it
      # resolves the version the same way rather than re-deriving it from the
      # ref, which on a dispatch would be a branch name.
      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Run the packaged binary on this runner
        run: |
          version="$VERSION"
          tarball="dist/verger-${version}-${{ matrix.asset }}.tar.gz"
          mkdir -p unpack
          tar -xzf "$tarball" -C unpack
          test -x unpack/verger || { echo "::error::the tarball has no executable verger at its root"; exit 1; }
          # The page must be IN the platform tarball, not only in the separate
          # verger-man archive: brew installs the platform tarball, so this is
          # the check that decides whether a brew user actually gets a manpage.
          # Listing the archive first, then the unpacked tree, catches both a
          # tarball that never had it and one that has it at the wrong depth.
          tar -tzf "$tarball" | grep -qx 'man/verger.1' \
            || { echo "::error::${{ matrix.asset }} tarball has no man/verger.1 at its expected path"; tar -tzf "$tarball"; exit 1; }
          test -s unpack/man/verger.1 \
            || { echo "::error::unpacked man/verger.1 is missing or empty"; exit 1; }
          got="$(unpack/verger version)"
          echo "verger version on ${{ matrix.runner }}: ${got}"
          case "$got" in
            *"${version}"*) ;;
            *) echo "::error::packaged binary reports '${got}', expected the tag version ${version}"; exit 1 ;;
          esac
          # Completions must be non-empty for all three shells
          for shell in bash zsh fish; do
            out="$(unpack/verger completion "$shell")"
            [ -n "$out" ] || { echo "::error::verger completion $shell is empty"; exit 1; }
          done

  # The publish job is skipped on a dispatch, which is the point of a dispatch
  # — and that is exactly why a broken publish step used to survive until the
  # first real tag. This job runs on every dispatch and does the one thing that
  # fails when publish is misconfigured: talking to the GitHub API. Read only,
  # so it can never create, edit or upload anything.
  publish-preflight:
    # Needs nothing: it is cheap, it does not build, and it must be able to
    # report a broken publish even when the build is the thing that is red.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the release API the way publish will
        env:
          GH_TOKEN: ${{ github.token }}
          # Same env publish uses, on purpose: a preflight that does not set
          # GH_REPO would pass while publish, which never checks the repo out,
          # fails with "not a git repository". The point is to exercise the
          # exact call publish makes, not a tidier version of it.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1
          echo "gh can reach ${GH_REPO} without a checkout; publish will too"

  publish:
    needs: [build, smoke]
    # A dispatch run proves the pipeline without publishing: no GitHub release
    # is created and the tap is not bumped, so a candidate can be exercised as
    # often as needed. Only a real tag publishes.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: darwin-universal
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: checksums
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job never checks the repository out, so there is no
          # git remote in $GITHUB_WORKSPACE for gh to infer. Without this, gh
          # falls back to the cwd and fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber

      # The first tag also creates Formula/verger.rb: the tap is not seeded with
      # a placeholder sha256 (that would fail `brew audit` and the tap's own CI),
      # so the formula appears only once a real artifact exists to point at.
      #
      # The formula is RENDERED IN FULL from the template below on every run,
      # not patched in place. The previous shape had a single top-level url and
      # sha256 for a darwin-only tap, and grafting two OS blocks onto it by
      # regex is how a formula ends up serving a linuxbrew user a darwin
      # tarball. Re-rendering makes the result a pure function of the tag, so
      # the two-OS shape is guaranteed rather than maintained.
      - name: Bump the formula in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          version="$VERSION"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is not set; the homebrew-tap formula cannot be bumped" >&2
            exit 1
          fi
          base="https://github.com/odiumuniverse/verger/releases/download/${GITHUB_REF_NAME}"
          # The digests below are pipelines, and a pipeline exits with its last
          # command: a missing tarball makes sha256sum fail while cut still exits
          # 0, so the formula would be rendered with sha256 "" and the release
          # would commit it. Homebrew then fails much later, on a user machine,
          # pointing at the tap instead of at an artefact that was never built.
          # So the files are checked before the hashes are read.
          for f in dist/verger-"${version}"-{darwin-universal,linux-amd64,linux-arm64}.tar.gz; do
            [ -f "$f" ] || { echo "::error::$f is missing; the formula cannot be rendered"; exit 1; }
          done
          sha_darwin="$(sha256sum "dist/verger-${version}-darwin-universal.tar.gz" | cut -d' ' -f1)"
          sha_amd64="$(sha256sum "dist/verger-${version}-linux-amd64.tar.gz" | cut -d' ' -f1)"
          sha_arm64="$(sha256sum "dist/verger-${version}-linux-arm64.tar.gz" | cut -d' ' -f1)"
          mkdir -p formula
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/odiumuniverse/homebrew-tap.git" tap
          cd tap
          ruby - "$base" "$version" "$sha_darwin" "$sha_amd64" "$sha_arm64" <<'RB'
          require "fileutils"
          base, version, sha_darwin, sha_amd64, sha_arm64 = ARGV
          template = <<~'FORMULA'
            class Verger < Formula
              desc "Deliver agent packages to every coding agent host"
              homepage "https://github.com/odiumuniverse/verger"
              # brew audit flags an explicit version as redundant with the one
              # it scans from the url; the tarball names carry it.
              license "MIT"

              on_macos do
                # brew style rejects a bare url/sha256 directly inside
                # on_macos/on_linux: the arch has to be stated, because
                # "darwin-universal" and "linux-amd64" are not the same file.
                # Both mac branches point at the same universal tarball, which
                # is exactly what Homebrew expects a universal artifact to look
                # like: one url, declared for both arches.
                on_intel do
                  url "__DARWIN_URL__"
                  sha256 "__DARWIN_SHA__"
                end

                on_arm do
                  url "__DARWIN_URL__"
                  sha256 "__DARWIN_SHA__"
                end
              end

              on_linux do
                on_intel do
                  url "__AMD64_URL__"
                  sha256 "__AMD64_SHA__"
                end

                on_arm do
                  url "__ARM64_URL__"
                  sha256 "__ARM64_SHA__"
                end
              end

              def install
                bin.install "verger"
                # The man page ships inside the platform tarball, so a brew
                # install gets it without a second download. Dir[] because
                # gendocs may add subcommand pages later and they should land
                # without another edit here.
                man1.install Dir["man/*.1"]
                # No shells: list. The default is the set the binary actually
                # generates, so adding a shell is a change in one place — the
                # binary — instead of two.
                generate_completions_from_executable(bin/"verger", "completion")
              end

              test do
                assert_match version.to_s, shell_output("#{bin}/verger version")
                # `brew test` is the only place a missing man1.install shows up
                # as a failure rather than as a user typing `man verger` and
                # getting nothing.
                assert_path_exists man1/"verger.1"
              end
            end
          FORMULA
          src = template
            .gsub("__DARWIN_URL__", "#{base}/verger-#{version}-darwin-universal.tar.gz")
            .gsub("__DARWIN_SHA__", sha_darwin)
            .gsub("__ARM64_URL__", "#{base}/verger-#{version}-linux-arm64.tar.gz")
            .gsub("__ARM64_SHA__", sha_arm64)
            .gsub("__AMD64_URL__", "#{base}/verger-#{version}-linux-amd64.tar.gz")
            .gsub("__AMD64_SHA__", sha_amd64)
          path = "Formula/verger.rb"
          FileUtils.mkdir_p(File.dirname(path))
          File.write(path, src)
          RB
          git add Formula/verger.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "verger ${version}"
          git push
