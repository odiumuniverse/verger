name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # One-time setup: base64 of the self-signed .p12 in MACOS_SIGN_P12, its password
      # in MACOS_SIGN_P12_PASSWORD, any throwaway keychain password in
      # MACOS_SIGN_KEYCHAIN_PASSWORD. Until then releases are ad-hoc signed.
      - name: Import the signing identity
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_SIGN_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then
            echo "::warning::MACOS_SIGN_P12 is not set; releases fall back to ad-hoc signing"
            exit 0
          fi
          {
            echo "$SIGN_P12" | base64 --decode > signing.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
            security set-keychain-settings -lut 3600 signing.keychain
            security import signing.p12 -k signing.keychain -P "$SIGN_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" signing.keychain >/dev/null
            security list-keychains -d user -s signing.keychain $(security list-keychains -d user | tr -d '"')
            rm -f signing.p12
          } || echo "::warning::could not import the signing identity; releases fall back to ad-hoc signing"

      # The tarball carries a bare `verger` at its root because the formula does
      # `bin.install "verger"`.
      - name: Build the universal tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/arm64 build/amd64 dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -mod=vendor -ldflags "-X main.version=${version}" -o build/arm64/verger ./cmd/verger
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -mod=vendor -ldflags "-X main.version=${version}" -o build/amd64/verger ./cmd/verger
          lipo -create -output dist/verger build/arm64/verger build/amd64/verger
          # Sign after lipo: merging architectures invalidates an earlier signature, and
          # the identifier must be set because codesign would default a Go binary to a.out.
          if codesign --force --sign "odiumuniverse code signing" --timestamp=none --identifier com.odiumuniverse.verger dist/verger 2>/dev/null; then
            codesign --verify --strict dist/verger
            echo "signed dist/verger"
          else
            echo "::warning::no signing identity; dist/verger stays ad-hoc signed"
          fi
          tar -czf "dist/verger-${version}-darwin-universal.tar.gz" -C dist verger

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dist/verger-${version}-darwin-universal.tar.gz" --clobber

      # The first tag also creates Formula/verger.rb: the tap is not seeded with a
      # placeholder sha256 (that would fail `brew audit` and the tap's own CI), so the
      # formula appears only once a real artifact exists to point at.
      - name: Bump the formula in homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is not set; the homebrew-tap formula cannot be bumped" >&2
            exit 1
          fi
          url="https://github.com/odiumuniverse/verger/releases/download/${GITHUB_REF_NAME}/verger-${version}-darwin-universal.tar.gz"
          sha="$(shasum -a 256 "dist/verger-${version}-darwin-universal.tar.gz" | cut -d' ' -f1)"
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/odiumuniverse/homebrew-tap.git" tap
          cd tap
          ruby - "$url" "$sha" <<'RB'
          path = "Formula/verger.rb"
          url, sha = ARGV
          if File.exist?(path)
            src = File.read(path)
            src = src.sub(%r{url "https://github\.com/odiumuniverse/verger[^"]*"}, "url \"#{url}\"")
            src = src.sub(/sha256 ".*"/, "sha256 \"#{sha}\"")
          else
            src = <<~FORMULA
              class Verger < Formula
                desc "Deliver agent packages to every coding agent host"
                homepage "https://github.com/odiumuniverse/verger"
                url "#{url}"
                sha256 "#{sha}"
                license "MIT"

                def install
                  bin.install "verger"
                end

                test do
                  assert_match version.to_s, shell_output("\#{bin}/verger version")
                end
              end
            FORMULA
          end
          File.write(path, src)
          RB
          git add Formula/verger.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "verger ${version}"
          git push
